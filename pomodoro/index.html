<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pomodoro</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter&family=JetBrains+Mono&display=swap">

    <link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="app">
    <div id="timer">25:00</div>

    <div id="controls">
        <button id="start">start</button>
        <button id="reset">reset</button>
    </div>

    <button id="settings-toggle">settings</button>
    <section id="settings" hidden>
        <h2>settings</h2>

        <label>
            Font
            <select id="font-select">
                <option value="Inter">Inter</option>
                <option value="JetBrains Mono">JetBrains Mono</option>
            </select>
        </label>

        <label>
            Accent color
            <input type="color" id="accent-color" value="#ff6b6b" />
        </label>

        <label>
            Alarm sound
            <input type="file" id="sound-upload" accept="audio/*" />
        </label>
    </section>
</main>

<script src="app.js" defer></script>
</body>
</html>
